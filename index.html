<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResNet101 Data Preparation Workspace</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ResNet101 Data Preparation</h1>
            <div class="header-controls">
                <div class="status-counter">
                    <span class="counter cropped-count">Cropped: 0</span>
                    <span class="counter uncropped-count">Uncropped: 0</span>
                </div>
                <button id="themeToggle" class="theme-toggle">🌙</button>
            </div>
        </header>

        <div class="upload-section">
            <input type="file" id="imageUpload" multiple accept="image/*" style="display: none;">
            <button id="uploadBtn" class="btn btn-primary">Upload Images</button>
            <button id="downloadBtn" class="btn btn-success" disabled>Download All</button>
        </div>

        <div class="crop-options">
            <label class="checkbox-container">
                <input type="checkbox" id="deepSquareCrop">
                <span class="checkmark"></span>
                Deep Square Crop
            </label>
        </div>

        <div class="image-grid" id="imageGrid"></div>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Modal for cropping -->
    <div id="cropModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Crop Image</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <img id="cropImage" style="max-width: 100%;">
            </div>
            <div class="modal-footer">
                <button id="saveCrop" class="btn btn-primary">Save Crop</button>
                <button id="cancelCrop" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script>
        class ResNetWorkspace {
            constructor() {
                this.images = [];
                this.currentPage = 1;
                this.imagesPerPage = 20;
                this.cropper = null;
                this.currentImageIndex = -1;
                this.isDarkMode = false;
                
                this.initializeEventListeners();
                this.updateCounters();
            }

            initializeEventListeners() {
                document.getElementById('uploadBtn').addEventListener('click', () => {
                    document.getElementById('imageUpload').click();
                });

                document.getElementById('imageUpload').addEventListener('change', (e) => {
                    this.handleImageUpload(e);
                });

                document.getElementById('downloadBtn').addEventListener('click', () => {
                    this.downloadAllImages();
                });

                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Modal events
                document.querySelector('.close').addEventListener('click', () => {
                    this.closeModal();
                });

                document.getElementById('cancelCrop').addEventListener('click', () => {
                    this.closeModal();
                });

                document.getElementById('saveCrop').addEventListener('click', () => {
                    this.saveCrop();
                });

                window.addEventListener('click', (e) => {
                    if (e.target === document.getElementById('cropModal')) {
                        this.closeModal();
                    }
                });
            }

            handleImageUpload(event) {
                const files = Array.from(event.target.files);
                
                files.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            this.images.push({
                                id: Date.now() + index,
                                originalSrc: e.target.result,
                                croppedSrc: null,
                                isCropped: false,
                                filename: file.name,
                                width: img.width,
                                height: img.height
                            });
                            
                            if (index === files.length - 1) {
                                this.renderImages();
                                this.updateCounters();
                                this.updateDownloadButton();
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            renderImages() {
                const grid = document.getElementById('imageGrid');
                const startIndex = (this.currentPage - 1) * this.imagesPerPage;
                const endIndex = Math.min(startIndex + this.imagesPerPage, this.images.length);
                
                grid.innerHTML = '';

                for (let i = startIndex; i < endIndex; i++) {
                    const imageData = this.images[i];
                    const imageCard = this.createImageCard(imageData, i);
                    grid.appendChild(imageCard);
                }

                this.renderPagination();
            }

            createImageCard(imageData, index) {
                const card = document.createElement('div');
                card.className = 'image-card';
                
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${imageData.croppedSrc || imageData.originalSrc}" alt="Image ${index + 1}">
                        <div class="status-badge ${imageData.isCropped ? 'cropped' : 'uncropped'}">
                            ${imageData.isCropped ? 'Cropped' : 'Uncropped'}
                        </div>
                    </div>
                    <div class="image-info">
                        <div class="image-size">${imageData.width} × ${imageData.height}</div>
                        <div class="image-controls">
                            <button class="btn btn-small btn-primary crop-btn" data-index="${index}">Crop</button>
                            ${imageData.isCropped ? `<button class="btn btn-small btn-secondary undo-btn" data-index="${index}">Undo</button>` : ''}
                        </div>
                    </div>
                `;

                // Add event listeners
                const cropBtn = card.querySelector('.crop-btn');
                cropBtn.addEventListener('click', () => this.openCropModal(index));

                const undoBtn = card.querySelector('.undo-btn');
                if (undoBtn) {
                    undoBtn.addEventListener('click', () => this.undoCrop(index));
                }

                return card;
            }

            openCropModal(index) {
                this.currentImageIndex = index;
                const imageData = this.images[index];
                const modal = document.getElementById('cropModal');
                const cropImage = document.getElementById('cropImage');
                
                // Create a square workspace with white padding
                this.createSquareWorkspace(imageData.originalSrc, (squareImageSrc) => {
                    cropImage.src = squareImageSrc;
                    modal.style.display = 'block';

                    // Initialize cropper after image is loaded
                    cropImage.onload = () => {
                        if (this.cropper) {
                            this.cropper.destroy();
                        }
                        
                        this.cropper = new Cropper(cropImage, {
                            aspectRatio: 1,
                            viewMode: 1, // Restrict crop box to within the image
                            autoCropArea: 0.8,
                            responsive: true,
                            restore: false,
                            guides: true,
                            highlight: false,
                            cropBoxMovable: true,
                            cropBoxResizable: true,
                            toggleDragModeOnDblclick: false,
                            background: true,
                            modal: true,
                            minCropBoxWidth: 50,
                            minCropBoxHeight: 50,
                        });
                    };
                });
            }

            createSquareWorkspace(imageSrc, callback) {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Determine the size of the square workspace
                    // Make it larger than the longest side of the image for better workspace
                    const maxDimension = Math.max(img.naturalWidth, img.naturalHeight);
                    const squareSize = Math.ceil(maxDimension * 1.4); // 40% larger than the longest side
                    
                    canvas.width = squareSize;
                    canvas.height = squareSize;
                    
                    // Fill with white background
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, squareSize, squareSize);
                    
                    // Calculate position to center the image
                    const x = (squareSize - img.naturalWidth) / 2;
                    const y = (squareSize - img.naturalHeight) / 2;
                    
                    // Draw the original image centered in the square workspace
                    ctx.drawImage(img, x, y, img.naturalWidth, img.naturalHeight);
                    
                    // Return the square workspace as data URL
                    callback(canvas.toDataURL('image/jpeg', 1.0));
                };
                
                img.src = imageSrc;
            }

            closeModal() {
                const modal = document.getElementById('cropModal');
                modal.style.display = 'none';
                if (this.cropper) {
                    this.cropper.destroy();
                    this.cropper = null;
                }
            }

            saveCrop() {
                if (!this.cropper || this.currentImageIndex === -1) return;

                // Get the cropped canvas directly - it already contains the white background
                const croppedCanvas = this.cropper.getCroppedCanvas({
                    width: 512,
                    height: 512,
                    fillColor: '#ffffff',
                    imageSmoothingEnabled: true,
                    imageSmoothingQuality: 'high'
                });

                const imageData = this.images[this.currentImageIndex];
                imageData.croppedSrc = croppedCanvas.toDataURL('image/jpeg', 0.9);
                imageData.isCropped = true;

                this.closeModal();
                this.renderImages();
                this.updateCounters();
                this.updateDownloadButton();
            }

            undoCrop(index) {
                const imageData = this.images[index];
                imageData.croppedSrc = null;
                imageData.isCropped = false;
                
                this.renderImages();
                this.updateCounters();
                this.updateDownloadButton();
            }

            renderPagination() {
                const pagination = document.getElementById('pagination');
                const totalPages = Math.ceil(this.images.length / this.imagesPerPage);
                
                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }

                let paginationHTML = '';
                
                // Previous button
                if (this.currentPage > 1) {
                    paginationHTML += `<button class="page-btn" onclick="workspace.goToPage(${this.currentPage - 1})">Previous</button>`;
                }

                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    const activeClass = i === this.currentPage ? 'active' : '';
                    paginationHTML += `<button class="page-btn ${activeClass}" onclick="workspace.goToPage(${i})">${i}</button>`;
                }

                // Next button
                if (this.currentPage < totalPages) {
                    paginationHTML += `<button class="page-btn" onclick="workspace.goToPage(${this.currentPage + 1})">Next</button>`;
                }

                pagination.innerHTML = paginationHTML;
            }

            goToPage(page) {
                this.currentPage = page;
                this.renderImages();
            }

            updateCounters() {
                const croppedCount = this.images.filter(img => img.isCropped).length;
                const uncroppedCount = this.images.length - croppedCount;
                
                document.querySelector('.cropped-count').textContent = `Cropped: ${croppedCount}`;
                document.querySelector('.uncropped-count').textContent = `Uncropped: ${uncroppedCount}`;
            }

            updateDownloadButton() {
                const downloadBtn = document.getElementById('downloadBtn');
                const hasImages = this.images.length > 0;
                downloadBtn.disabled = !hasImages;
            }

            async downloadAllImages() {
                if (this.images.length === 0) return;

                const prefix = prompt('Enter filename prefix:', 'resnet_image');
                if (!prefix) return;

                const zip = new JSZip();
                let downloadCount = 0;

                this.images.forEach((imageData, index) => {
                    const imageSrc = imageData.croppedSrc || imageData.originalSrc;
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    
                    img.onload = () => {
                        canvas.width = 512;
                        canvas.height = 512;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, 512, 512);
                        ctx.drawImage(img, 0, 0, 512, 512);
                        
                        canvas.toBlob((blob) => {
                            const filename = `${prefix}_${String(index + 1).padStart(3, '0')}.jpg`;
                            zip.file(filename, blob);
                            downloadCount++;
                            
                            if (downloadCount === this.images.length) {
                                zip.generateAsync({type: 'blob'}).then((content) => {
                                    const link = document.createElement('a');
                                    link.href = URL.createObjectURL(content);
                                    link.download = `${prefix}_dataset.zip`;
                                    link.click();
                                });
                            }
                        }, 'image/jpeg', 0.9);
                    };
                    
                    img.src = imageSrc;
                });
            }

            toggleTheme() {
                this.isDarkMode = !this.isDarkMode;
                document.body.classList.toggle('dark-mode', this.isDarkMode);
                const themeToggle = document.getElementById('themeToggle');
                themeToggle.textContent = this.isDarkMode ? '☀️' : '🌙';
            }
        }

        // Initialize workspace
        const workspace = new ResNetWorkspace();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</body>
</html>
